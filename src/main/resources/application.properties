# PatentLens Application Configuration
spring.application.name=patentlens
server.port=8080

# H2 File-based Database Configuration
spring.datasource.url=jdbc:h2:file:./data/patentlens;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Web Console (Available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Multipart Upload Limits (Support up to 25MB for patent PDFs)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# LLM API Configuration
# When llm.api.key is blank or invalid, PatentLens automatically activates MockLlmService
llm.api.key=
llm.api.url=https://api.openai.com/v1/chat/completions
llm.model=gpt-3.5-turbo

# Blockchain Mining Difficulty (Number of leading zeros required in SHA-256 hash)
patentlens.blockchain.difficulty=2
